<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="suiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="3" />

  <!-- Multi-layer Diamond / Cube Badge -->
  <path d="M64 22L98 42V86L64 106L30 86V42L64 22Z" fill="none" stroke="url(#suiteGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Inner Layers -->
  <path d="M64 34L86 47V79L64 92L42 79V47L64 34Z" fill="#18181b" stroke="url(#suiteGrad)" stroke-width="2" opacity="0.8" />
  
  <!-- Central Glowing Crown/Star -->
  <path d="M64 48L68 58L78 62L68 66L64 76L60 66L50 62L60 58Z" fill="url(#suiteGrad)" filter="url(#glow)" />
  
  <!-- Dots for 3 Sub-extensions -->
  <circle cx="46" cy="46" r="4" fill="#38bdf8" />
  <circle cx="82" cy="46" r="4" fill="#34d399" />
  <circle cx="64" cy="86" r="4" fill="#f43f5e" />
</svg>
