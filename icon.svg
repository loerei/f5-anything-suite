<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dev Toolkit Box Base -->
  <path d="M22 48C22 43.5817 25.5817 40 30 40H98C102.418 40 106 43.5817 106 48V96C106 100.418 102.418 104 98 104H30C25.5817 104 22 100.418 22 96V48Z" fill="#09090b" stroke="url(#boxGrad)" stroke-width="4" />
  
  <!-- Toolkit Handle -->
  <path d="M46 40V30C46 26.6863 48.6863 24 52 24H76C79.3137 24 82 26.6863 82 30V40" fill="none" stroke="url(#boxGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- 3 Glowing Tool Slots inside Box -->
  <!-- 1. Play Button F5 -->
  <path d="M38 58L50 66L38 74Z" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- 2. Clean Sparkle -->
  <path d="M64 56L66 64L74 66L66 68L64 76L62 68L54 66L62 64Z" fill="#34d399" filter="url(#glow)" />
  
  <!-- 3. Binary 01 Tag -->
  <text x="88" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-weight="900" font-size="14" fill="#a855f7" text-anchor="middle" filter="url(#glow)">01</text>
  
  <!-- Front Latch Lock -->
  <rect x="56" y="82" width="16" height="10" rx="3" fill="url(#boxGrad)" filter="url(#glow)" />
</svg>
